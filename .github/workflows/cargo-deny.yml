name: cargo-deny
on:
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.toml','Cargo.lock','deny.toml']
  push:
    branches: [main]
    paths: ['Cargo.toml','Cargo.lock','deny.toml']
jobs:
  cargo-deny:
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/cargo-deny.yml@d5b95a0892fafa8f14e9b51b8fda46f22cd79ec3
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

