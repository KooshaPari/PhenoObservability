name: Monthly SBOM Refresh
on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month
  workflow_dispatch:
jobs:
  call-sbom-refresh:
    uses: KooshaPari/phenotype-tooling/.github/workflows/sbom-monthly.yml@42f1c29b495fa2a9acbbc3eeff0aaad5fa76aad7
    with:
      repo_path: '.'
      build_system: 'rust'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

