name: Monthly SBOM Refresh
on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month
  workflow_dispatch:
jobs:
  call-sbom-refresh:
    uses: KooshaPari/phenotype-tooling/.github/workflows/sbom-monthly.yml@c9905aa716ddf340210b869280346538caa70916
    with:
      repo_path: '.'
      build_system: 'rust'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

