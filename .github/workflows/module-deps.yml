name: module-deps

# L4 module-deps gate (v14 cycle-3 P0, ADR-048 substrate graduation).
# Requires acyclic module dependencies across all workspace member crates.
# Leaf `-types` crates hold bare struct/enum definitions; behavior uses free
# functions in implementation crates to avoid Type↔method cycles in
# cargo-modules v0.26.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  module-deps:
    name: module-deps (cargo-modules --acyclic, workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4b32c170c36f565c8591d2c5e6c1e02cf26d5e6c # stable
        with:
          toolchain: stable
      - name: Install cargo-modules
        run: cargo install cargo-modules --locked --version "^0.26"
      - name: Install jq (for workspace member enumeration)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: cargo-modules dependencies --acyclic (per workspace member)
        run: |
          set -euo pipefail
          mapfile -t CRATES < <(
            cargo metadata --no-deps --format-version=1 \
              | jq -r '.workspace_members[] as $m | .packages[] | select(.id == $m) | .name'
          )
          FAIL=0
          for crate in "${CRATES[@]}"; do
            echo "=== ${crate} ==="
            if ! cargo modules dependencies --acyclic --no-fns --no-traits --no-types -p "${crate}"; then
              echo "::error::${crate} has a module dependency cycle"
              FAIL=1
            fi
          done
          exit "${FAIL}"
