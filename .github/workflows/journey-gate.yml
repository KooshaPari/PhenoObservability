name: Journey Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  journey-gate:
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/journey-gate.yml@dc8de1c7f6ba738ae47bbd0b07c8e30bc7cc36b9
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

