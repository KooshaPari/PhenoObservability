name: Journey Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  journey-gate:
    uses: KooshaPari/phenotype-tooling/.github/workflows/reusable/journey-gate.yml@42f1c29b495fa2a9acbbc3eeff0aaad5fa76aad7
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

