# cargo-audit configuration for PhenoObservability.
#
# Created 2026-09-08 as part of fix/cargo-audit-cve-bumps-20260908.
#
# Format reference: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example
#
# Note: cargo-audit has no configuration for `yanked` crates — the chacha20 v0.10.1
# yanked notice (transitively pulled in by rand 0.10.2 -> quinn-proto 0.11.16 -> quinn 0.11.9
# -> reqwest 0.13.4) is reported as a warning and does not fail the check by default.
# Re-evaluate when reqwest upgrades to a quinn-proto release that no longer pins rand<0.10.2.

[advisories]
ignore = [
    # RUSTSEC-2026-0221: `event-listener` allows `!Send` tags to cross thread boundaries via `StackSlot`.
    # Status: unsound, no upstream fix at the time of writing.
    # Crate:    event-listener v5.4.1
    # Path:     event-listener 5.4.1 -> async-lock 3.4.2 -> redis 1.3.0 -> pheno-dragonfly 0.1.0
    # Mitigation: pheno-dragonfly uses redis only on the test/dev target; the runtime async-lock
    # usage in pheno-dragonfly never constructs a `StackSlot` that crosses threads. Revisit when
    # smol-rs/event-listener ships a fix (track https://github.com/smol-rs/event-listener/pull/163).
    "RUSTSEC-2026-0221",
]
